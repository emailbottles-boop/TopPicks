<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Filled dynamically by product.js -->
  <title id="meta-title">Loading… — TopPicks</title>
  <meta name="description" id="meta-desc" content="">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:type" content="product">
  <meta property="og:site_name" content="TopPicks">
  <meta property="og:title" id="og-title" content="">
  <meta property="og:description" id="og-desc" content="">
  <meta property="og:image" id="og-image" content="">

  <!-- JSON-LD structured data (filled by JS) -->
  <script type="application/ld+json" id="json-ld"></script>

  <link rel="stylesheet" href="css/style.css">
  <style>
    .product-page { max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem; }

    .breadcrumb { font-size: .82rem; color: var(--text-muted); margin-bottom: 1.5rem; }
    .breadcrumb a { color: var(--primary); }
    .breadcrumb a:hover { text-decoration: underline; }

    .product-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
      align-items: start;
    }

    .product-image-wrap {
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      background: var(--surface2);
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .product-image-wrap img {
      max-width: 100%;
      max-height: 380px;
      object-fit: contain;
    }

    .product-info { display: flex; flex-direction: column; gap: 1rem; }

    .product-badge {
      display: inline-block;
      background: var(--accent);
      color: white;
      font-size: .75rem;
      font-weight: 700;
      padding: .25rem .75rem;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: .5px;
      width: fit-content;
    }

    .product-title { font-size: 1.55rem; font-weight: 800; line-height: 1.3; }

    .product-rating {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .9rem;
    }
    .product-rating .stars { color: #f59e0b; font-size: 1.1rem; }
    .product-rating .count { color: var(--text-muted); }

    .product-price { font-size: 2rem; font-weight: 900; }

    .product-desc {
      font-size: .97rem;
      color: var(--text-muted);
      line-height: 1.7;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }

    .product-tags { display: flex; flex-wrap: wrap; gap: .4rem; }
    .product-tag {
      padding: .25rem .65rem;
      border-radius: 99px;
      background: var(--surface2);
      font-size: .78rem;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .buy-block {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    .buy-block .buy-btn {
      display: block;
      text-align: center;
      padding: .9rem;
      font-size: 1rem;
      border-radius: 10px;
    }

    .buy-note {
      font-size: .75rem;
      color: var(--text-muted);
      text-align: center;
    }

    .related-section { margin-top: 3rem; }
    .related-section h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.25rem; }

    .product-error { text-align: center; padding: 5rem 1rem; color: var(--text-muted); }

    .pros-section { margin-top: .25rem; }
    .pros-section h3 { font-size: .88rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .5px; color: var(--text-muted); margin-bottom: .6rem; }
    .pros-list { list-style: none; display: flex; flex-direction: column; gap: .45rem; }
    .pros-list li { font-size: .9rem; padding-left: 1.4rem; position: relative; }
    .pros-list li::before { content: '✓'; position: absolute; left: 0;
      color: var(--success); font-weight: 800; }

    .trust-row { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .78rem;
      color: var(--text-muted); justify-content: center; }

    .disclosure-inline { font-size: .75rem; color: var(--text-muted); text-align: center; }
    .disclosure-inline a { color: var(--primary); }

    .related-section { margin-top: 3rem; }
    .related-section h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.25rem; }

    @media (max-width: 640px) {
      .product-layout { grid-template-columns: 1fr; }
      .product-title { font-size: 1.25rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="/" class="logo">&#9733; Top<span>Picks</span></a>
    <div class="search-bar">
      <input id="search" type="search" placeholder="Search products…" autocomplete="off">
    </div>
    <a href="admin/dashboard.html" class="header-cta">Dashboard</a>
  </div>
</header>

<div class="product-page" id="product-page">
  <p style="color:var(--text-muted);padding:4rem 0;text-align:center">Loading…</p>
</div>

<div id="email-bar" class="email-bar hidden">
  <div class="email-bar-inner">
    <span class="email-bar-text">&#127381; Get the best deals in your inbox</span>
    <div class="email-bar-form">
      <input id="email-input" type="email" placeholder="your@email.com" autocomplete="email">
      <button onclick="subscribeEmail()">Subscribe</button>
    </div>
    <button class="email-bar-close" onclick="dismissEmailBar()" aria-label="Close">&#10005;</button>
  </div>
</div>

<p class="disclaimer">
  As an Amazon Associate I earn from qualifying purchases. ·
  <a href="disclosure.html">Affiliate Disclosure</a>
</p>

<footer>
  <p>
    © <span id="year"></span> TopPicks ·
    <a href="/">Home</a> ·
    <a href="disclosure.html">Disclosure</a> ·
    <a href="admin/dashboard.html">Dashboard</a>
  </p>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</footer>

<div id="toast" class="toast"></div>
<script src="js/email-bar.js"></script>
<script src="js/product.js"></script>
</body>
</html>
